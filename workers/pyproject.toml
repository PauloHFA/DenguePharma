[project]
name = "denguepharma-workers"
version = "0.1.0"
description = "Workers de processamento documental e extração assistida por IA do DenguePharma"
requires-python = ">=3.11"
dependencies = [
    "pika>=1.3,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

