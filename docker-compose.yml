name: denguepharma

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-denguepharma}
      POSTGRES_USER: ${DB_USER:-denguepharma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-denguepharma} -d ${DB_NAME:-denguepharma}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-denguepharma}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Armazenamento de objetos privado para documentos (versões imutáveis por hash).
  minio:
    image: denguepharma-minio:local
    build: ./infra/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-denguepharma}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?defina MINIO_PASSWORD no .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  worker:
    profiles: [pipeline]
    build: ./workers
    restart: unless-stopped
    environment:
      BACKEND_URL: ${PIPELINE_BACKEND_URL:-http://host.docker.internal:8080}
      PIPELINE_TOKEN: ${PIPELINE_TOKEN:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-denguepharma}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: ${MINIO_USER:-denguepharma}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-18080}:18080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-denguepharma}
      DB_USER: ${DB_USER:-denguepharma}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_with_at_least_32_characters_12345}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@denguepharma.org}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-AdminPassword123!}
      PIPELINE_TOKEN: ${PIPELINE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  rabbitdata:
  miniodata:

