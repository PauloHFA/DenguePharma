[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "denguepharma-analytics"
version = "0.21.0"
description = "Fundacao analitica do DenguePharma: dados versionados, marts e dashboards"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "streamlit>=1.40,<2",
  "duckdb>=1.1,<2", "pyarrow>=18,<30", "pandas>=3,<4",
  "psycopg[binary]>=3.2,<4", "ipykernel>=6,<8", "nbclient>=0.10,<1",
  "nbformat>=5,<6", "PyYAML>=6,<7", "scipy>=1.15,<2", "matplotlib>=3.10,<4",
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "matplotlib>=3.10,<4"]

[project.scripts]
dengue-analytics = "denguepharma_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
denguepharma_analytics = ["reports/*.qmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["requirement(*ids): requisitos SDD cobertos pelo teste"]
filterwarnings = [
  "ignore:.*httpx.*:DeprecationWarning"
]
