name: DenguePharma CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-and-spec:
    name: Backend Java & Spec Traceability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências dos Workers (para testes de integração do backend)
        run: |
          python -m pip install --upgrade pip
          pip install -e workers/

      - name: Executar Testes do Backend Spring Boot
        env:
          PIPELINE_PYTHON: python
        run: mvn -f backend/pom.xml test

      - name: Validar Matriz de Requisitos e Rastreabilidade
        run: python spec/check.py

  workers-and-analytics:
    name: Workers & Analytics (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências e Testar Workers
        run: |
          python -m pip install --upgrade pip
          pip install -e workers/
          pip install pytest pytest-cov
          pytest workers/tests

      - name: Instalar Dependências e Testar Analytics
        run: |
          python -m pip install -r analytics/requirements.lock
          pip install --no-deps -e analytics/
          pytest analytics/tests -m "not external"

  frontend:
    name: Frontend SPA (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: frontend
        run: npm ci

      - name: Executar Testes Unitários do Frontend
        working-directory: frontend
        run: npm test

      - name: Build de Produção do Frontend
        working-directory: frontend
        run: npm run build
