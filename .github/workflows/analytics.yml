name: Analytics foundation
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.19'
      - run: python -m pip install -r analytics/requirements.lock
      - run: python -m pip install --no-deps -e analytics
      - run: python spec/check.py
      - run: QUARTO_BIN=$(command -v quarto) python -m pytest analytics/tests --junitxml=analytics/target/junit.xml
      - run: python spec/check.py --junit analytics/target/junit.xml
