spring:
  application:
    name: denguepharma-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/denguepharma}
    username: ${DB_USER:denguepharma}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

denguepharma:
  security:
    # Segredo HMAC do JWT: obrigatório, mínimo de 32 caracteres. Sem valor padrão.
    jwt-secret: ${JWT_SECRET}
    jwt-ttl-minutes: 60
  bootstrap:
    # Cria o primeiro administrador somente se não houver nenhum usuário.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  ingest:
    # Opcionais: a chave do NCBI aumenta a quota das E-utilities; o e-mail identifica o cliente.
    ncbi-api-key: ${NCBI_API_KEY:}
    contact-email: ${NCBI_CONTACT_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health

